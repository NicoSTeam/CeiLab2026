<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <title>Signin Template · Bootstrap v5.0</title>
        <!-- Bootstrap core CSS -->
        <link href="../bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <!-- Custom styles for this template -->
        <link href="../Estilos/sign-in.css" rel="stylesheet">
    </head>
    <body class="bg-primary text-center">
        <main class="form-signin">
            <form>
                <img class="mb-4" src="../assets/img/Ceilab-logo.jpg" alt="" width="120">
                <h1 class="fw-normal h3 mb-3 text-white">Acceso</h1>
                <label for="inputEmail" class="visually-hidden">Email address</label>
                <input type="email" id="inputEmail" class="form-control" placeholder="Tu email" required="" autofocus="">
                <label for="inputPassword" class="visually-hidden">Password</label>
                <input type="password" id="inputPassword" class="form-control" placeholder="Tu contraseña" required="">
                <div class="checkbox mb-3">
                    <label class="text-white">
                        <input type="checkbox" value="remember-me"> Recuérdame
                    </label>
                </div>
                <button class="btn btn-info btn-lg w-100" type="submit">Entrar</button>
                <p class="mb-3 mt-5 text-white">© 2026</p>
            </form>
        </main>
        <script src="../assets/js/popper.min.js"></script>
        <script src="../bootstrap/js/bootstrap.min.js"></script>
    </body>
</html>
