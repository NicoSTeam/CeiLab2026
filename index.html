<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Asignaturas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="formulario">

        <h2 class="titulo">Registro de Asignaturas</h2>

        <div id="alerta" class="alert alert-success d-none" role="alert"> </div>

        <form id="formularioAsignatura">

            
            <div class="mb-3">
                <label for="asignatura" class="form-label">
                    Asignatura
                </label>

                <select id="asignatura" class="form-select" required>
                    <option value="">Seleccione una asignatura</option>
                    <option value="Matemática">Matemática</option>
                    <option value="Programación">Programación</option>
                    <option value="Base de Datos">Base de Datos</option>
                    <option value="Inglés">Inglés</option>
                    <option value="Redes">Redes</option>
                    <option value="Sistemas Operativos"> Sistemas Operativos </option>
                    <option value="Desarrollo Web"> Desarrollo Web </option>
                </select>
            </div>

            <div class="row">

                
                <div class="col-md-6 mb-3">
                    <label for="anio" class="form-label">
                        Año
                    </label>

                    <select id="anio" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option value="1er año">1er año</option>
                        <option value="2do año">2do año</option>
                        <option value="3er año">3er año</option>
                    </select>
                </div>

                
                <div class="col-md-6 mb-3">
                    <label for="semestre" class="form-label">
                        Semestre
                    </label>

                    <select id="semestre" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option value="1er semestre">1er semestre</option>
                        <option value="2do semestre">2do semestre</option>
                    </select>
                </div>

            </div>

            <div class="row">

                
                <div class="col-md-6 mb-3">
                    <label for="cupos" class="form-label">
                        Cantidad de cupos
                    </label>

                    <input 
                        type="number" 
                        id="cupos" 
                        class="form-control"
                        min="1"
                        max="40"
                        placeholder="Ej: 30"
                        required
                    >
                </div>

                
                <div class="col-md-6 mb-3">
                    <label for="turno" class="form-label">
                        Turno
                    </label>

                    <select id="turno" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                        <option value="Nocturno">Nocturno</option>
                    </select>
                </div>

            </div>

            
            <div class="mb-3">
                <label for="docente" class="form-label">
                    Docente responsable
                </label>

                <input 
                    type="text"
                    id="docente"
                    class="form-control"
                    placeholder="Ingrese el nombre del docente"
                    required
                >
            </div>

            
            <div class="mb-3">
                <label for="estado" class="form-label">
                    Estado
                </label>

                <select id="estado" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option value="Activa">Activa</option>
                    <option value="Inactiva">Inactiva</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success btn-guardar">
                Guardar
            </button>

        </form>

    </div>

    <script>

        const formulario = document.getElementById("formularioAsignatura");
        const alerta = document.getElementById("alerta");

        formulario.addEventListener("submit", function(event) {

           
            event.preventDefault();

            // Saco los datos para mostrar en la alerta
            const asignatura = document.getElementById("asignatura").value;
            const anio = document.getElementById("anio").value;
            const semestre = document.getElementById("semestre").value;
            const cupos = document.getElementById("cupos").value;
            const turno = document.getElementById("turno").value;
            const docente = document.getElementById("docente").value;
            const estado = document.getElementById("estado").value;

            // Mostrar los datos en la alerta
            alerta.innerHTML = `
                <h5 class="alert-heading">
                    ¡Asignatura guardada correctamente!
                </h5>

                <hr>

                <strong>Asignatura:</strong> ${asignatura}<br>
                <strong>Año:</strong> ${anio}<br>
                <strong>Semestre:</strong> ${semestre}<br>
                <strong>Cupos:</strong> ${cupos}<br>
                <strong>Turno:</strong> ${turno}<br>
                <strong>Docente:</strong> ${docente}<br>
                <strong>Estado:</strong> ${estado}
            `;

            // Mostrar la alerta
            alerta.classList.remove("d-none");

            //Firma atentamente un fan de DOOM, DC esta sobrevalorado.(la nueva serie de linternas verdes esta genial).

        });

    </script>

</body>
</html>
